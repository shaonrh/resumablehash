[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "resumablehash"
version = "1.0.0"
description = "Resumable SHA-2 hash implementations (SHA-256, SHA-384, SHA-512) with pickle support"
authors = [
    {name = "Luke Moore"},
]
readme = "README.md"
requires-python = ">=3.6"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []
license = {text = "Unlicense"}

[project.urls]
Homepage = "https://github.com/shaonrh/resumablehash"

[tool.cibuildwheel]
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
